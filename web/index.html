<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Cosi-Lab – Dokusuche</title>
</head>
<body>
    <h1>Cosi-Lab – Dokusuche</h1>

    <form id="search-form">
        <label for="question">Frage zur Projektdoku</label><br>
        <textarea id="question" rows="3" cols="60" required></textarea><br>

        <label>
            <input id="multi-source" type="checkbox">
            Bis zu zwei Fundstellen verwenden
        </label><br>

        <label for="provider">Modellanbieter</label>
        <select id="provider">
            <option value="gpt">GPT</option>
            <option value="gemini">Gemini</option>
        </select><br>

        <button type="submit">Vorschau anzeigen</button>
        <button id="answer-button" type="submit">Mit Modell beantworten</button>
    </form>

    <h2>Promptvorschau</h2>
    <pre id="output" style="white-space: pre-wrap" aria-live="polite">Noch keine Frage gestellt.</pre>

    <h2>Modellantwort</h2>
    <pre id="answer-output" style="white-space: pre-wrap" aria-live="polite">Noch kein Modell aufgerufen.</pre>

    <h2>Letzte Dokuläufe</h2>
    <p id="history-status" role="status"></p>
    <ul id="run-history"></ul>

    <h2>Gespeicherten Dokulauf öffnen</h2>
    <form id="load-run-form">
        <label for="run-id">Dokulauf-ID</label>
        <input id="run-id" type="number" min="1" step="1" required>
        <button id="load-run-button" type="submit">Dokulauf laden</button>
    </form>

    <pre id="run-output" style="white-space: pre-wrap" aria-live="polite">Noch kein Dokulauf geladen.</pre>

    <script>
        const form = document.getElementById("search-form");
        const question = document.getElementById("question");
        const multiSource = document.getElementById("multi-source");
        const provider = document.getElementById("provider");
        const answerButton = document.getElementById("answer-button");
        const output = document.getElementById("output");
        const answerOutput = document.getElementById("answer-output");
        const buttons = form.querySelectorAll("button");

        const historyStatus = document.getElementById("history-status");
        const runHistory = document.getElementById("run-history");
        const loadRunForm = document.getElementById("load-run-form");
        const runIdInput = document.getElementById("run-id");
        const loadRunButton = document.getElementById("load-run-button");
        const runOutput = document.getElementById("run-output");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            // Nur der Antwortknopf darf einen Modellaufruf auslösen.
            const wantsAnswer = event.submitter === answerButton;
            const endpoint = wantsAnswer
                ? "/doc-questions/answer"
                : "/doc-questions/preview";
            const target = wantsAnswer ? answerOutput : output;
            const payload = {
                question: question.value,
                multi_source: multiSource.checked,
            };

            if (wantsAnswer) {
                payload.provider = provider.value;
            }

            output.textContent = "";
            answerOutput.textContent = "";
            target.textContent = wantsAnswer
                ? "Antwort wird erstellt …"
                : "Suche läuft …";

            // Während der Anfrage sollen keine weiteren Aufrufe starten.
            buttons.forEach(button => {
                button.disabled = true;
            });

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    target.textContent = typeof error.detail === "string"
                        ? error.detail
                        : `Anfrage fehlgeschlagen (HTTP ${response.status}).`;
                    return;
                }

                // textContent zeigt den Prompt als Text an, nicht als HTML.
                const data = await response.json();
                output.textContent =
                    data.prompt ?? "Keine passende Fundstelle gefunden.";

                if (wantsAnswer) {
                    if (data.answer === null) {
                        answerOutput.textContent = "Kein Modell aufgerufen.";
                    } else {
                        const status = data.api_status
                            ? `\nAPI-Status: ${data.api_status}`
                            : "";
                        answerOutput.textContent =
                            `${data.answer}\n\nModell: ${data.model}\n` +
                            `Dokulauf-ID: ${data.run_id}${status}`;

                        // Die Antwort wurde gespeichert. Lade den Verlauf neu.
                        await loadRunHistory();
                    }
                }
            } catch {
                target.textContent =
                    "Die Antwort der lokalen API konnte nicht gelesen werden.";
            } finally {
                buttons.forEach(button => {
                    button.disabled = false;
                });
            }
        });

        async function loadRunHistory() {
            historyStatus.textContent = "Verlauf wird geladen …";

            try {
                const response = await fetch("/doc-runs?limit=10");

                if (!response.ok) {
                    historyStatus.textContent =
                        `Der Verlauf konnte nicht geladen werden (HTTP ${response.status}).`;
                    return;
                }

                const data = await response.json();

                // Ersetze die bisherigen Einträge, statt sie erneut anzuhängen.
                runHistory.replaceChildren();

                if (data.runs.length === 0) {
                    historyStatus.textContent = "Noch keine Dokuläufe gespeichert.";
                    return;
                }

                for (const run of data.runs) {
                    const item = document.createElement("li");
                    const button = document.createElement("button");
                    button.type = "button";
                    button.textContent =
                        `#${run.id} · ${run.question} · ${run.model} · ${run.requested_at_utc}`;

                    // Ein Klick verwendet dieselbe Lesefunktion wie die ID-Eingabe.
                    button.addEventListener("click", () => loadDocRun(run.id));
                    item.append(button);
                    runHistory.append(item);
                }

                historyStatus.textContent = "";
            } catch {
                historyStatus.textContent = "Der Verlauf konnte nicht geladen werden.";
            }
        }

        async function loadDocRun(id) {
            // Verhindere, dass zwei Detailabrufe gleichzeitig die Ausgabe ändern.
            if (loadRunButton.disabled) {
                return;
            }

            runIdInput.value = String(id);
            runOutput.textContent = "Dokulauf wird geladen …";
            loadRunButton.disabled = true;

            try {
                const runId = encodeURIComponent(id);
                const response = await fetch(`/doc-runs/${runId}`);

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    runOutput.textContent = typeof error.detail === "string"
                        ? error.detail
                        : `Abruf fehlgeschlagen (HTTP ${response.status}).`;
                    return;
                }

                const run = await response.json();

                // Die API liefert die damaligen Ausschnitte aus SQLite.
                const sources = run.sources.map(source =>
                    `${source.path}:${source.start_line}-${source.end_line}\n${source.text}`
                ).join("\n\n");

                runOutput.textContent = [
                    `Dokulauf ${run.id} · ${run.model}`,
                    `Frage: ${run.question}`,
                    `Gesendeter Prompt:\n${run.prompt}`,
                    `Gespeicherte Fundstellen:\n${sources}`,
                    `Antwort:\n${run.response_text}`,
                    `Erkannte Fundstellen: ${run.citations.cited.join(", ") || "keine"}`,
                    `Unbekannte Fundstellen: ${run.citations.unknown.join(", ") || "keine"}`,
                ].join("\n\n");
            } catch {
                runOutput.textContent = "Der Dokulauf konnte nicht geladen werden.";
            } finally {
                loadRunButton.disabled = false;
            }
        }

        loadRunForm.addEventListener("submit", (event) => {
            event.preventDefault();
            loadDocRun(runIdInput.value);
        });

        // Zeige die letzten Läufe schon beim Öffnen der Startseite an.
        loadRunHistory();
    </script>
</body>
</html>
