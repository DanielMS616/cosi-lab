services:
  temperature:
    build: .

    # Schlüssel werden nur für Modellberichte gebraucht.
    env_file:
      - path: .env
        required: false
    user: "${COSI_UID:-10001}:${COSI_GID:-10001}"

    # Damit Berichte und Datenbank auch nach dem Containerlauf erhalten bleiben.
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./reports
        target: /app/reports
        bind:
          create_host_path: false
