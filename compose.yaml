services:
  api:
    build: .
    restart: unless-stopped

    # Übergibt die vorhandenen API-Schlüssel erst beim Containerstart.
    env_file: .env
    user: "${COSI_UID:?COSI_UID fehlt}:${COSI_GID:?COSI_GID fehlt}"

    # Verwendet auf Cosi-Lab denselben lokalen Port wie bisher.
    ports:
      - "127.0.0.1:8000:8000"

    # Die API liest und schreibt dieselbe SQLite-Datei wie zuvor.
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
